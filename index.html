<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <title>NMC vs LFP | Battery Chemistry Explorer</title>
  <style>
    :root { color-scheme: dark; --bg: #101713; --line: #304038; --text: #f0f4ec; --muted: #a0afa4; --lime: #c5f36b; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: radial-gradient(ellipse at 12% 0%, #263a2a 0, transparent 34rem), var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell { display: grid; width: 100%; height: 100%; grid-template-rows: 58px minmax(0, 1fr); }
    .toolbar {
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 22px;
      border-bottom: 1px solid #304038;
      background: #121a15;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: #cad5ca; font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .brand-mark { display: grid; width: 27px; height: 27px; place-items: center; border: 1px solid #4d634f; border-radius: 9px; color: var(--lime); font-size: 16px; }
    .languages { display: flex; gap: 5px; padding: 4px; border: 1px solid #304038; border-radius: 11px; background: #101713; }
    .language-button { min-width: 76px; padding: 7px 12px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); font: inherit; font-size: 11px; font-weight: 650; cursor: pointer; }
    .language-button:hover { color: var(--text); }
    .language-button[aria-pressed="true"] { border-color: #627c45; background: #293722; color: #e1f9b0; }
    .language-button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
    iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
    @media (max-width: 520px) {
      .toolbar { padding: 0 12px; }
      .brand { gap: 7px; font-size: 9px; letter-spacing: .08em; }
      .brand-mark { width: 24px; height: 24px; }
      .language-button { min-width: 62px; padding: 7px 9px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="toolbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">+</span> Battery chemistry explorer</div>
      <nav class="languages" aria-label="Choose language">
        <button class="language-button" type="button" data-language="en" aria-pressed="true">English</button>
        <button class="language-button" type="button" data-language="ru" aria-pressed="false">Русский</button>
      </nav>
    </header>
    <iframe id="language-view" title="Battery chemistry comparison" allow="fullscreen"></iframe>
  </div>
  <script>
    const frame = document.getElementById("language-view");
    const buttons = [...document.querySelectorAll(".language-button")];
    let activeLanguage = new URLSearchParams(location.search).get("lang") === "ru" ? "ru" : "en";
    let pendingLanguage = null;
    let stateForRestore = null;
    let switchTimeout;

    function updateLanguageButtons() {
      buttons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.language === activeLanguage));
      });
    }

    function loadLanguage(language, state = null) {
      activeLanguage = language;
      stateForRestore = state;
      updateLanguageButtons();
      const query = `?lang=${language}`;
      history.replaceState(null, "", `${location.pathname}${query}`);
      frame.src = language === "ru" ? "ru.html" : "en.html";
    }

    frame.addEventListener("load", () => {
      if (stateForRestore) {
        frame.contentWindow.postMessage({ type: "battery:restore-state", state: stateForRestore }, "*");
        stateForRestore = null;
      }
    });

    window.addEventListener("message", (event) => {
      if (event.source !== frame.contentWindow || event.data?.type !== "battery:state" || !pendingLanguage) return;
      clearTimeout(switchTimeout);
      const language = pendingLanguage;
      pendingLanguage = null;
      loadLanguage(language, event.data);
    });

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const language = button.dataset.language;
        if (language === activeLanguage || pendingLanguage) return;
        pendingLanguage = language;
        frame.contentWindow.postMessage({ type: "battery:get-state" }, "*");
        switchTimeout = setTimeout(() => {
          if (pendingLanguage !== language) return;
          pendingLanguage = null;
          loadLanguage(language);
        }, 300);
      });
    });

    updateLanguageButtons();
    frame.src = activeLanguage === "ru" ? "ru.html" : "en.html";
  </script>
</body>
</html>
